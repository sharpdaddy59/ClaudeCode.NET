name: Publish to NuGet

on:
  push:
    tags:
      - 'v*' # v0.1.0 etc. - the tag is the publish button

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC token issuance for NuGet Trusted Publishing
      contents: write # create the GitHub Release

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags: release notes list commits since the previous tag

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test --configuration Release

      - name: Verify tag matches csproj version
        run: |
          CSPROJ_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/ClaudeCode/ClaudeCode.csproj)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CSPROJ_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match csproj version $CSPROJ_VERSION - refusing to publish"
            exit 1
          fi

      - name: Pack
        run: dotnet pack src/ClaudeCode --configuration Release --output ./artifacts

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived
      # (1 hour) NuGet API key. No stored secrets - nuget.org validates this
      # workflow against the trusted publishing policy on the sharpdaddy account.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: sharpdaddy

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # The GitHub Release is the changelog. This repo commits straight to main
      # (no PRs), so GitHub's auto-generated notes would be just a compare link;
      # list the commit subjects since the previous tag instead. Runs last so a
      # Release only exists for versions that actually reached nuget.org.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "NuGet: https://www.nuget.org/packages/ClaudeCode.Net/${GITHUB_REF_NAME#v}"
            echo
            git log ${PREV:+$PREV..}"$GITHUB_REF_NAME" --no-merges --format='- %s'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
